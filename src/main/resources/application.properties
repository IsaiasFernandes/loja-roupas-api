spring.application.name=loja-roupas
server.port=8080

# Banco H2 salvo em arquivo (os dados continuam depois de reiniciar a aplicação)
spring.datasource.url=jdbc:h2:file:./data/lojaroupas
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
